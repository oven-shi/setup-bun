name: 'Setup Bun'
description: 'Set up Bun by The Oven-shi — install Bun in your GitHub Actions workflows.'
author: 'oven-shi'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  bun-version:
    description: 'The version of Bun to install. A semver range or exact version, e.g. 1.2.17'
    default: 'latest'
  github-token:
    description: 'GitHub token used to fetch Bun releases, avoids rate limits'
    default: '${{ github.token }}'
  registry-url:
    description: 'Optional registry to set up for auth. Will set auth in ~/.npmrc'
    required: false
  scope:
    description: 'Optional scope for auth against the registry'
    required: false
runs:
  using: 'composite'
  steps:
    - name: setup bun runtime
      shell: bash
      run: bash "${{ github.action_path }}/dist/index.sh"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_BUN_VERSION: ${{ inputs.bun-version }}
        INPUT_REGISTRY_URL: ${{ inputs.registry-url }}
        INPUT_SCOPE: ${{ inputs.scope }}
